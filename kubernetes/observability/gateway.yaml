apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: global-external-gateway
  namespace: demo
spec:
  gatewayClassName: gke-l7-global-external-managed-mc
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
      kinds:
      - kind: HTTPRoute
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app-route
  namespace: demo
spec:
  parentRefs:
  - name: global-external-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api/app-a
    backendRefs:
    - group: net.gke.io
      kind: ServiceImport
      name: app-a
      port: 8080
  - matches:
    - path:
        type: PathPrefix
        value: /api/app-b
    backendRefs:
    - group: net.gke.io
      kind: ServiceImport
      name: app-b
      port: 8080
