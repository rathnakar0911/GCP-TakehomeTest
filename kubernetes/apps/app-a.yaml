apiVersion: v1
kind: ConfigMap
metadata:
  name: app-a-config
  namespace: demo
data:
  APP_NAME: app-a
  CLUSTER_NAME: "CLUSTER_NAME_PLACEHOLDER"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-a-secret
  namespace: demo
type: Opaque
stringData:
  DEMO_SECRET: "assessment-only"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-a
  namespace: demo
  labels:
    app: app-a
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-a
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: app-a
    spec:
      terminationGracePeriodSeconds: 20
      containers:
      - name: app-a
        image: IMAGE_REGISTRY_PLACEHOLDER/app-a:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - configMapRef:
            name: app-a-config
        - secretRef:
            name: app-a-secret
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: http
          initialDelaySeconds: 15
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: app-a
  namespace: demo
spec:
  type: ClusterIP
  selector:
    app: app-a
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: app-a
  namespace: demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: app-a
  minReplicas: 2
  maxReplicas: 5
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
    scaleDown:
      stabilizationWindowSeconds: 60
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: app-a
  namespace: demo
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: app-a
---
apiVersion: net.gke.io/v1
kind: ServiceExport
metadata:
  name: app-a
  namespace: demo
