apiVersion: v1
kind: ConfigMap
metadata:
  name: app-b-config
  namespace: demo
data:
  APP_NAME: app-b
  CLUSTER_NAME: "CLUSTER_NAME_PLACEHOLDER"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-b-secret
  namespace: demo
type: Opaque
stringData:
  DEMO_SECRET: "assessment-only"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-b
  namespace: demo
  labels:
    app: app-b
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-b
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: app-b
    spec:
      terminationGracePeriodSeconds: 20
      containers:
      - name: app-b
        image: IMAGE_REGISTRY_PLACEHOLDER/app-b:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - configMapRef:
            name: app-b-config
        - secretRef:
            name: app-b-secret
        readinessProbe:
          httpGet:
            path: /api/app-b/health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /api/app-b/health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: app-b
  namespace: demo
spec:
  type: ClusterIP
  selector:
    app: app-b
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: app-b
  namespace: demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: app-b
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: app-b
  namespace: demo
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: app-b
---
apiVersion: net.gke.io/v1
kind: ServiceExport
metadata:
  name: app-b
  namespace: demo
